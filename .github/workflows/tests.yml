name: Identity Fairy synthetic prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s prototype -v
      - run: python prototype/identity_fairy.py prototype/before.json prototype/after.json --output /tmp/fairy-review.md
